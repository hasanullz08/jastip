<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jastip.Mekkah</title>
<meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&family=Outfit:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--surf:#f6f3ea;--ink:#111111;--mute:#6b665a;--line:#e6e1d2;--gold:#d6a736;--gold2:#9a6a00;--bad:#c0392b;--cut:16px;
--cham:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
--para:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;background:radial-gradient(900px 420px at 85% -80px,rgba(214,167,54,.16),transparent 70%),linear-gradient(112deg,transparent 0 58%,rgba(214,167,54,.05) 58% 58.3%,transparent 58.3%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
input,select{background:#fff;border:1px solid var(--line);border-radius:0;padding:9px 12px;min-width:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ann{background:var(--gold) repeating-linear-gradient(115deg,rgba(0,0,0,.07) 0 10px,transparent 10px 20px);color:#0a0a0a;overflow:hidden;white-space:nowrap;font:italic 700 17px "Barlow Condensed",sans-serif;letter-spacing:.05em;padding:8px 0}
.ann div{display:inline-block;animation:mq 34s linear infinite}.ann span{padding:0 30px}.ann span::before{content:"";display:inline-block;width:8px;height:8px;background:#0a0a0a;transform:rotate(45deg);margin-right:30px;vertical-align:1px}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ann div{animation:none}}
.hd{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
.hd::after{content:"";position:absolute;left:50%;bottom:-1px;width:150px;height:3px;background:var(--gold);transform:translateX(-50%) skewX(-30deg)}
.logo{display:flex;align-items:center;gap:12px;font:italic 800 clamp(24px,6vw,34px)/1 "Barlow Condensed",sans-serif;letter-spacing:.01em;text-align:left}
.logo small{display:block;font:500 11px Outfit,sans-serif;letter-spacing:.22em;color:var(--gold2);margin-top:3px;font-style:normal}
.lg{width:clamp(44px,10vw,58px);aspect-ratio:1;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(214,167,54,.6);object-fit:cover;background:#000}
.ib{background:none;border:0;cursor:pointer;padding:6px;display:inline-grid;place-items:center}
.ib svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hd>div:last-child{text-align:right}
.sb{display:none;padding:12px 22px;border-bottom:1px solid var(--line)}.sb.on{display:block}.sb input{width:100%}
.main{max-width:1260px;margin:0 auto;padding:22px 22px 80px}
.btn{display:inline-block;background:var(--gold);color:#0a0a0a;border:0;padding:12px 28px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;clip-path:var(--para)}
.btn:hover{filter:brightness(1.12)}
.btn.g{background:#efebdf;color:var(--ink);padding:9px 20px}
.dmh{padding:9px 22px;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 16px}
.tab{border:0;background:#efebdf;color:var(--ink);padding:8px 24px;cursor:pointer;white-space:nowrap;clip-path:var(--para)}
.tab:hover{background:#e4dfcf}.tab[aria-pressed=true]{background:var(--gold);color:#0a0a0a;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.top h1{margin:0;font:italic 800 clamp(28px,5vw,40px)/1 "Barlow Condensed",sans-serif}
.top h1::before{content:"";display:inline-block;width:10px;height:.8em;background:var(--gold);transform:skewX(-18deg);margin-right:14px;vertical-align:-.05em}
.top label{color:var(--mute);display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){:root{--cut:12px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.main,.hd{padding-left:14px;padding-right:14px}.dm{padding:16px 18px}}
.card{position:relative;background:var(--surf);clip-path:var(--cham);display:flex;flex-direction:column;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card::before,.card::after{content:"";position:absolute;width:var(--cut);height:var(--cut);z-index:2;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--gold) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px))}
.card::before{left:0;bottom:0}.card::after{right:0;top:0}
.img{position:relative;aspect-ratio:1/.9;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 58%,rgba(214,167,54,.24),transparent 62%),repeating-linear-gradient(115deg,#15140f 0 14px,#0f0e0b 14px 28px)}
.img img{width:100%;height:100%;object-fit:cover}
.img .ph{font-size:64px;filter:drop-shadow(0 6px 14px rgba(214,167,54,.45))}
.badge{position:absolute;top:14px;left:0;background:var(--gold);color:#0a0a0a;font:italic 700 16px "Barlow Condensed",sans-serif;padding:3px 18px 3px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);z-index:1}
.badge.out{left:auto;right:0;background:#f6f2ea;padding:3px 12px 3px 18px;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%)}
.add{position:absolute;left:0;right:0;bottom:0;display:block;text-align:center;text-decoration:none;background:var(--gold);color:#0a0a0a;font:italic 700 19px "Barlow Condensed",sans-serif;letter-spacing:.04em;padding:10px;transform:translateY(100%);transition:transform .2s;z-index:1}
.card:hover .add,.add:focus-visible{transform:none}
@media(hover:none){.add{transform:none;padding:7px;font-size:16px}}
.card.gone .add{display:none}.card.gone .img{opacity:.5}
.info{padding:16px 18px 22px;display:grid;gap:3px;justify-items:start;text-align:left}
.info::before{content:"";width:30px;height:3px;background:var(--gold);margin-bottom:8px;transform:skewX(-30deg)}
.info b{font-weight:600}.info .tg{color:var(--mute);font-size:14px;min-height:21px}
.low{font-size:13px;color:var(--bad)}
.pr{font:italic 800 28px/1.1 "Barlow Condensed",sans-serif;color:var(--gold2);margin-top:4px}.pr s{color:var(--mute);font:500 15px Outfit,sans-serif;margin-left:10px}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.gate{max-width:360px;margin:12vh auto;padding:0 18px;display:grid;gap:12px}.gate h1{font:italic 800 40px "Barlow Condensed",sans-serif}
.err{color:var(--bad);min-height:1.4em;font-size:14px}
.pn{background:var(--surf);border-left:4px solid var(--gold);padding:16px 18px;margin:16px 0;display:grid;gap:10px}
.pn label{font-size:14px;color:var(--mute);display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ar{display:grid;grid-template-columns:1fr 1fr 1fr 70px;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ar .nm{grid-column:1/-1;font-weight:600}
.ar .ac{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.ar label{font-size:13px;color:var(--mute)}
h3.ar{margin:22px 0 0;font:italic 800 26px "Barlow Condensed",sans-serif;color:var(--gold2);border-bottom:2px solid var(--gold)}
@media(max-width:520px){.ar{grid-template-columns:1fr 1fr}}
.dm{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(100deg,#b88a22,#d6a736 45%,#f0cd73);color:#0a0a0a;clip-path:var(--cham);padding:26px 30px;margin-bottom:22px}
.dm::after{content:"";position:absolute;right:-50px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.28)}
.dm>*{position:relative;z-index:1}
.dm b{display:block;font:italic 800 clamp(24px,5vw,36px)/1.1 "Barlow Condensed",sans-serif}
.dm span{display:block;margin-top:4px;font-weight:500;opacity:.85}
.dm .btn{background:#0a0a0a;color:#f0cd73}
.hr{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.ib{position:relative}
.cnt{position:absolute;top:-4px;right:-6px;background:var(--gold);color:#0a0a0a;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.add{border:0;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}.ov.on{display:block}
.dr{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:#fff;border-left:4px solid var(--gold);padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;overflow:auto}
.dr h2{margin:0;font:italic 800 32px "Barlow Condensed",sans-serif}
.ci{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-bottom:1px solid var(--line);padding:10px 0;align-items:center}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tot{display:flex;justify-content:space-between;font:italic 800 26px "Barlow Condensed",sans-serif;margin-top:auto;padding-top:8px}
.help{font-size:14px;color:var(--mute)}.help.ok{color:#1c7a3b;font-weight:600}
.bn{position:relative;overflow:hidden;height:clamp(340px,44vw,540px);background:radial-gradient(60% 70% at 50% 45%,#fff,#f1ede2);clip-path:var(--cham);margin-bottom:22px;display:grid;place-items:center}
.ht{position:relative;z-index:2;text-align:center;display:grid;justify-items:center;gap:4px;pointer-events:none}
.hta{font:400 clamp(84px,17vw,210px)/1 Lalezar,"Barlow Condensed",sans-serif;color:#0a0a0a;text-shadow:5px 6px 0 rgba(214,167,54,.6)}
.hen{font:italic 800 clamp(24px,4.6vw,54px)/1 "Barlow Condensed",sans-serif;letter-spacing:.05em}
.pill{pointer-events:auto;margin-top:14px;display:inline-flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--gold);border-radius:999px;padding:8px 22px;font:italic 700 clamp(15px,2.4vw,26px) "Barlow Condensed",sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(214,167,54,.28)}
.pill i{width:1px;height:24px;background:var(--line)}.pill svg{width:22px;height:22px;stroke:var(--mute);fill:none;stroke-width:1.8;stroke-linecap:round}
.hc{position:absolute;width:16%;aspect-ratio:.74;background:#fff;border:0;border-radius:24px;box-shadow:0 14px 32px rgba(0,0,0,.13);transform:rotate(var(--r));transition:transform .2s;cursor:pointer;padding:0;overflow:hidden}
.hc:hover{transform:rotate(var(--r)) translateY(-6px)}
.hi{display:grid;place-items:center;width:100%;height:100%;background:radial-gradient(circle at 50% 56%,rgba(214,167,54,.3),transparent 66%),#faf8f3}
.hi img{width:100%;height:100%;object-fit:cover}.hi .ph{font-size:clamp(36px,7vw,96px);filter:drop-shadow(0 6px 12px rgba(0,0,0,.15))}
.hl{position:absolute;top:10px;left:0;right:0;text-align:center;font:600 12px Outfit,sans-serif;color:var(--mute)}
.hp{position:absolute;left:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2);display:grid;place-items:center;font-weight:700;font-size:20px;line-height:1;color:#0a0a0a}
.c1{left:2%;top:36%;--r:-8deg}.c2{left:17%;top:-6%;--r:10deg}.c3{left:20%;top:54%;--r:-6deg}.c4{right:17%;top:-8%;--r:-9deg}.c5{right:20%;top:52%;--r:8deg}.c6{right:2%;top:30%;--r:6deg}
@media(max-width:700px){.bn{height:360px}.hc{width:34%}.c2,.c3,.c4,.c5{display:none}.c1{left:-8%;top:56%}.c6{right:-8%;top:-6%}}
</style>
</head>

function copyText(t){const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()};try{navigator.clipboard.writeText(t).catch(fb)}catch(e){fb()}}
const gone=p=>p.stock!==null&&p.stock!==undefined&&p.stock<=0;

function heroHtml(){
 const pick=CATS.map(c=>S.items.find(p=>p.cat===c&&p.img)||S.items.find(p=>p.cat===c)).filter(Boolean);
 const cards=pick.slice(0,6).map((p,i)=>'<button class="hc c'+(i+1)+'" data-hc="'+esc(p.cat)+'" aria-label="Lihat '+esc(p.cat)+'"><span class="hi">'+(p.img?'<img src="'+p.img+'" alt="">':'<span class="ph" aria-hidden="true">'+EMO[p.cat]+'</span>')+'</span><span class="hl">'+esc(p.cat)+'</span><span class="hp" aria-hidden="true">+</span></button>').join("");
 return'<section class="bn" aria-label="Banner">'+cards+'<div class="ht"><div class="hta" lang="ar" dir="rtl">مكة</div><div class="hen">JASTIP.MEKKAH</div><button class="pill" id="bp" type="button">'+I.s+'<i></i><span>Tumbler · Parfum · Sajadah · Coklat</span></button></div></section>';
}
function readView(){
 let l=S.items.filter(p=>(cat==="Semua"||p.cat===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
 if(sort==="lo")l=[...l].sort((a,b)=>a.price-b.price);if(sort==="hi")l=[...l].sort((a,b)=>b.price-a.price);
 
 let h='<div class="hd"><div><button class="ib" id="sb" aria-label="Cari">'+I.s+'</button></div><div class="logo"><img class="lg" src="'+LOGO+'" alt="Logo Jastip.Mekkah"><span>'+esc(S.shop)+'<small>katalog jastip</small></span></div><div class="hr">'+(dmUrl()?'<a class="btn dmh" target="_blank" rel="noopener" href="'+esc(dmUrl())+'">DM admin</a>':'')+'<button class="ib" id="cb" aria-label="Keranjang">'+I.c+'<span class="cnt" id="cn">'+cartN()+'</span></button></div></div>';
 h+='<div class="sb'+(searchOn?' on':'')+'" id="sw"><input type="search" id="q" placeholder="Cari produk" aria-label="Cari produk" value="'+esc(q)+'"></div><div class="main">'+heroHtml()+'<div class="dm"><div><b>Jika berminat membeli, silakan DM admin.</b><span>Sebutkan nama produk yang kamu mau, admin akan balas secepatnya.</span></div>'+(dmUrl()?'<a class="btn" target="_blank" rel="noopener" href="'+esc(dmUrl())+'">DM admin</a>':'')+'</div>';
 h+='<div class="tabs">'+["Semua",...CATS].map(c=>'<button class="tab" data-c="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+'</button>').join("")+'</div>';
 h+='<div class="top"><h1>'+esc(cat==="Semua"?"Semua produk":cat)+'</h1><label>Urutkan<select id="so"><option value="rec">Rekomendasi</option><option value="lo">Harga terendah</option><option value="hi">Harga tertinggi</option></select></label></div>';
 h+=l.length?'<div class="grid">'+l.map(p=>{
  const lowS=p.stock>0&&p.stock<=2;
  return'<article class="card'+(gone(p)?' gone':'')+'"><div class="img">'+(p.img?'<img src="'+p.img+'" alt="'+esc(p.name)+'">':'<span class="ph" aria-hidden="true">'+EMO[p.cat]+'</span>')+(gone(p)?'<span class="badge out">Habis</span>':p.isNew?'<span class="badge">Baru</span>':'')+''+'<button class="add" data-add="'+p.id+'">Tambah ke keranjang</button>'+'</div><div class="info"><b>'+esc(p.name)+'</b><div class="tg">'+esc(p.tag)+'</div>'+(lowS?'<div class="low">Sisa '+p.stock+'</div>':'')+'<div class="pr">'+rp(p.price)+(p.old?'<s>'+rp(p.old)+'</s>':'')+'</div></div></article>';
 }).join("")+'</div>':'<div class="empty">Produk tidak ditemukan. Coba kata kunci lain.</div>';
 h+='</div>';app.innerHTML=h;
 document.getElementById("so").value=sort;document.getElementById("so").onchange=e=>{sort=e.target.value;readView()};
 document.getElementById("sb").onclick=()=>{searchOn=!searchOn;readView();if(searchOn)document.getElementById("q").focus()};
 const qi=document.getElementById("q");qi.oninput=e=>{q=e.target.value;readView();const x=document.getElementById("q");x.focus();x.setSelectionRange(q.length,q.length)};
 app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cat=b.dataset.c;readView()});
 document.getElementById("cb").onclick=openCart;
 document.getElementById("bp").onclick=()=>document.getElementById("sb").click();
 app.querySelectorAll("[data-hc]").forEach(b=>b.onclick=()=>{cat=b.dataset.hc;readView();window.scrollTo({top:document.querySelector(".tabs").offsetTop-10,behavior:"smooth"})});
 app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const id=b.dataset.add,p=S.items.find(x=>x.id==id),cur=cart[id]||0;if(p.stock!==null&&p.stock!==undefined&&cur>=p.stock){b.textContent="Stok maksimal";return}cart[id]=cur+1;saveCart();document.getElementById("cn").textContent=cartN();b.textContent="Ditambahkan";setTimeout(()=>b.textContent="Tambah ke keranjang",900)});
}
function openCart(){
 const rows=Object.keys(cart).map(id=>({p:S.items.find(x=>x.id==id),q:cart[id]})).filter(r=>r.p&&r.q>0);
 const tot=rows.reduce((a,r)=>a+r.p.price*r.q,0);
 const msg="Halo admin, saya mau pesan:\n"+rows.map(r=>"- "+r.p.name+" x"+r.q+" ("+rp(r.p.price*r.q)+")").join("\n")+"\nTotal: "+rp(tot);
 const url=dmUrl(),wa=/wa\.me/.test(url),ig=/instagram|ig\.me/.test(url);
 const label=wa?"Kirim pesanan lewat WhatsApp":ig?"Salin pesanan &amp; buka Instagram":"Salin pesanan &amp; buka chat admin";
 dr.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2>Keranjang</h2><button class="btn g" id="cl">Tutup</button></div>'+(rows.length?rows.map(r=>'<div class="ci"><div><b>'+esc(r.p.name)+'</b><div class="help">'+rp(r.p.price)+'</div></div><div class="qty"><button data-m="'+r.p.id+'" aria-label="Kurangi">-</button><span>'+r.q+'</span><button data-pl="'+r.p.id+'" aria-label="Tambah">+</button></div></div>').join("")+'<div class="tot"><span>Total</span><span>'+rp(tot)+'</span></div><div class="help" id="hl">Silakan DM admin untuk membeli. Pesanan disalin otomatis, tinggal tempel di chat lalu kirim.</div>'+(url?'<button class="btn" id="chk">'+label+'</button>':'<div class="help">Kontak admin belum diisi.</div>'):'<div class="empty">Keranjang masih kosong. Pilih produk dulu.</div>');
 ov.classList.add("on");
 document.getElementById("cl").onclick=()=>ov.classList.remove("on");
 const chk=document.getElementById("chk");
 if(chk)chk.onclick=()=>{if(wa){window.open(url+(url.includes("?")?"&":"?")+"text="+encodeURIComponent(msg),"_blank");return}copyText(msg);const hl=document.getElementById("hl");hl.textContent="Pesanan tersalin. Di chat, tahan kolom pesan lalu pilih Tempel, kemudian kirim.";hl.className="help ok";window.open(url,"_blank")};
 dr.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{cart[b.dataset.m]--;if(cart[b.dataset.m]<=0)delete cart[b.dataset.m];saveCart();openCart();document.getElementById("cn").textContent=cartN()});
 dr.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{const p=S.items.find(x=>x.id==b.dataset.pl);if(p.stock===null||p.stock===undefined||cart[p.id]<p.stock)cart[p.id]++;saveCart();openCart();document.getElementById("cn").textContent=cartN()});
}
ov.onclick=e=>{if(e.target===ov)ov.classList.remove("on")};

function gate(msg=""){
 app.innerHTML='<form class="gate" id="f"><h1 style="margin:0">Admin</h1><input type="password" id="pw" placeholder="Password admin" aria-label="Password admin" autocomplete="current-password"><div class="err" role="alert">'+esc(msg)+'</div><button class="btn">Masuk</button></form>';
 document.getElementById("pw").focus();
 document.getElementById("f").onsubmit=e=>{e.preventDefault();if(document.getElementById("pw").value===PASS){authed=true;adminView()}else gate("Password salah. Coba lagi.")};
}
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.78))};im.src=r.result};r.readAsDataURL(file)}
function adminView(){
 let h='<div class="main"><div class="top"><h1>Admin</h1><div><a class="btn g" href="#">Lihat katalog</a> <button class="btn g" id="out">Keluar</button></div></div>';
 h+='<div class="pn"><div class="two"><label>Nama toko<input type="text" id="sn" value="'+esc(S.shop)+'"></label><label>Link DM admin (username Instagram, misal jastip.mekkah, atau link wa.me)<input type="text" id="wa" value="'+esc(S.dm)+'"></label></div><label>Teks pengumuman (bar atas)<input type="text" id="an" value="'+esc(S.ann)+'"></label></div>';
 h+='<div class="pn"><b>Tambah produk</b><div class="two"><input type="text" id="nn" placeholder="Nama produk" aria-label="Nama produk"><select id="nc" aria-label="Kategori">'+CATS.map(c=>'<option>'+esc(c)+'</option>').join("")+'</select></div><div class="two"><input type="number" id="np" placeholder="Harga" inputmode="numeric" aria-label="Harga"><input type="number" id="ns" placeholder="Stok (kosong = tersedia)" inputmode="numeric" aria-label="Stok"></div><button class="btn" id="add">Tambah</button></div>';
 for(const c of CATS){const it=S.items.filter(p=>p.cat===c);if(!it.length)continue;h+='<h3 class="ar" style="border:0">'+esc(c)+'</h3>';
  for(const p of it)h+='<div class="ar" data-id="'+p.id+'"><div class="nm">'+esc(p.name)+'</div><label class="note">Harga<input type="number" data-f="price" value="'+p.price+'"></label><label>Harga coret<input type="number" data-f="old" value="'+(p.old??"")+'"></label><label>Stok<input type="number" data-f="stock" value="'+(p.stock??"")+'" placeholder="ada"></label><label>Info<input type="text" data-f="tag" value="'+esc(p.tag)+'"></label><div class="ac"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-f="isNew"'+(p.isNew?' checked':'')+'> Baru</label><input type="file" accept="image/*" data-a="img" aria-label="Foto '+esc(p.name)+'" style="max-width:180px">'+(p.img?'<button class="btn g" data-a="noimg">Hapus foto</button>':'')+'<button class="btn g" data-a="habis">Habis</button><button class="btn g" data-a="del">Hapus</button></div></div>';}
 h+='<div class="pn"><button class="btn g" id="rst">Kembalikan data awal</button></div></div>';app.innerHTML=h;
 const g=id=>document.getElementById(id);
 g("out").onclick=()=>{authed=false;gate()};
 g("sn").onchange=e=>{S.shop=e.target.value;save()};g("an").onchange=e=>{S.ann=e.target.value;save()};g("wa").onchange=e=>{S.dm=e.target.value.trim();save()};
 g("add").onclick=()=>{const name=g("nn").value.trim(),price=+g("np").value;if(!name||!price)return;const s=g("ns").value;S.items.push({id:S.nextId++,cat:g("nc").value,name,price,old:null,stock:s===""?null:+s,tag:"",isNew:true,img:""});save();adminView()};
 g("rst").onclick=()=>{if(confirm("Kembalikan semua produk ke data awal?")){S.items=SEED;S.nextId=n+1;save();adminView()}};
 app.querySelectorAll(".ar[data-id]").forEach(r=>{const p=S.items.find(x=>x.id==r.dataset.id);
  r.querySelectorAll("[data-f]").forEach(i=>i.onchange=()=>{const f=i.dataset.f,v=i.value;p[f]=f==="isNew"?i.checked:f==="tag"?v:(v===""?null:+v);if(f==="price"&&p.price===null)p.price=0;save()});
  r.querySelector('[data-a=img]').onchange=e=>{if(e.target.files[0])shrink(e.target.files[0],d=>{p.img=d;save();adminView()})};
  const ni=r.querySelector('[data-a=noimg]');if(ni)ni.onclick=()=>{p.img="";save();adminView()};
  r.querySelector('[data-a=habis]').onclick=()=>{p.stock=0;save();adminView()};
  r.querySelector('[data-a=del]').onclick=()=>{if(confirm("Hapus "+p.name+"?")){S.items=S.items.filter(x=>x.id!==p.id);save();adminView()}};
 });
}
function route(){ov.classList.remove("on");location.hash==="#admin"?(authed?adminView():gate()):readView()}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
